# POC: PostgreSQL 18 Primary + Physical Standby + Logical Replicas
# Merge with docker-compose.postgres18.yaml (start postgres18 first).
# See brainstorming/PG18_REPLICATION_POC.md for setup and test cases.
#
# Nodes: primary (5433), physical (5434), logical from physical (5435), logical from primary (5436).

services:
  # Primary: config from .ddev/postgres18/postgresql.conf
  postgres18:
    volumes:
      - "postgres18_data:/var/lib/postgresql/data"
      - ".:/mnt/ddev_config"
      - "./postgres18-init:/docker-entrypoint-initdb.d"
      - "./postgres18:/etc/postgresql/poc-primary:ro"
      - "./../postgresql/logicaldb:/usr/share/postgresql/18/extension/logicaldb"
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/poc-primary/postgresql.conf

