# POC: Logical replica from primary only (port 5436)
# Subscribes to the primary (5433) via native logical replication.
# Loads the image default from PGDATA, then applies overrides below.

data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'
include = '/var/lib/postgresql/data/postgresql.conf'

# ---------------------------------------------------------------------------
# Logical replica: native subscription to primary (no physical in path)
# ---------------------------------------------------------------------------
listen_addresses = '*'
max_worker_processes = 10
max_replication_slots = 10
max_wal_senders = 10
