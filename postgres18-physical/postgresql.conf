# POC: Physical standby node (postgres18-physical)
# Loads the config from PGDATA (from pg_basebackup), then applies overrides below.
# Edit this file to change physical replica configuration.

data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'
include = '/var/lib/postgresql/data/postgresql.conf'

# ---------------------------------------------------------------------------
# Logging (file + level)
# ---------------------------------------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = info
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p] %q%u@%d '
log_replication_commands = on
log_checkpoints = on
log_lock_waits = on
log_statement = 'ddl'
log_duration = off

# ---------------------------------------------------------------------------
# Physical standby overrides (optional; basebackup copy may already set these)
# Must be >= primary for recovery to succeed (e.g. max_worker_processes).
# wal_level = logical required so logical subscriber can create slot on this standby (PG16+).
# shared_preload_libraries = pglogical so this node can act as pglogical provider if needed;
# pglogical_output plugin is loaded on demand when creating logical decoding slots (no preload).
# ---------------------------------------------------------------------------
listen_addresses = '*'
wal_level = logical
hot_standby = on
hot_standby_feedback = on
shared_preload_libraries = 'pglogical,pg_cron'
max_replication_slots = 24
max_wal_senders = 20
max_worker_processes = 10
sync_replication_slots = on

# Connect to primary for streaming replication (use repl/repl if using replication role)
primary_conninfo = 'host=postgres18 port=5432 user=db password=db dbname=db'
# max_standby_streaming_delay = 30s
