# POC: Primary node (postgres18)
# Loads the image default from PGDATA, then applies overrides below.
# Edit this file to change primary configuration.

data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'
include = '/var/lib/postgresql/data/postgresql.conf'

# ---------------------------------------------------------------------------
# Logging (file + level)
# ---------------------------------------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = info
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p] %q%u@%d '
log_replication_commands = on
log_checkpoints = on
log_lock_waits = on
log_statement = 'ddl'
log_duration = off

# ---------------------------------------------------------------------------
# Replication (primary: streaming + logical decoding for physical → logical)
# ---------------------------------------------------------------------------
listen_addresses = '*'
wal_level = logical
max_wal_senders = 20
max_replication_slots = 24
hot_standby_feedback = on

# ---------------------------------------------------------------------------
# pglogical (DDL-only sync to logical; data stays on native pub/sub)
# ---------------------------------------------------------------------------
shared_preload_libraries = 'pglogical,pg_cron'
cron.database_name = 'db'
max_worker_processes = 10
